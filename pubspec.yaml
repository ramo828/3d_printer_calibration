name: calibration_3d
description: "3D printer calibration tools."
publish_to: 'none'

# versionName = 2.0.3, versionCode = 3 (build.gradle.kts ile aynı)
version: 2.1.0+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 6.x eski Gradle sözdizimi (configurations.all) kullanıyor, Gradle 9 / AGP 9'da
  # build hatası veriyor. 9.x bunu düzeltti.
  google_mobile_ads: ^9.1.0
  fl_chart: ^1.0.0
  # Flutter'ın Material kütüphanesi artık ayrı paket (flutter/material.dart yerine).
  material_ui: ^1.11.0
  # 9.x sürümü material_ui ile uyumlu TextTheme döndürür.
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
